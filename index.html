<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f0f2f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#202c33" />
    <meta name="theme-color" content="#202c33" />
    
    <!-- Apple iOS Safari & Android PWA Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ChatBoot" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/pwa-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa-180x180.png" />
    <link rel="apple-touch-startup-image" href="/apple-splash.png" />
    
    <meta name="format-detection" content="telephone=no" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <title>SaaS WhatsApp Master</title>
    <script>
      // Anti-flicker e sincronização da barra de status no Android / PWA
      const applyThemeColor = (isDark) => {
         const color = isDark ? '#202c33' : '#f0f2f5';
         const metaThemes = document.querySelectorAll('meta[name="theme-color"]');
         if (metaThemes.length > 0) {
            metaThemes.forEach(el => el.setAttribute('content', color));
         } else {
            const metaTheme = document.createElement('meta');
            metaTheme.name = 'theme-color';
            metaTheme.content = color;
            document.head.appendChild(metaTheme);
         }
         const metaScheme = document.querySelector('meta[name="color-scheme"]');
         if (metaScheme) {
            metaScheme.setAttribute('content', isDark ? 'dark' : 'light');
         }
         const metaApple = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
         if (metaApple) {
            metaApple.setAttribute('content', isDark ? 'black-translucent' : 'default');
         }
      };

      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
        applyThemeColor(true);
      } else {
        document.documentElement.classList.remove('dark');
        applyThemeColor(false);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
