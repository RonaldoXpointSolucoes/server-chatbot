<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f0f2f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#202c33" />
    <meta name="theme-color" content="#202c33" />
    
    <!-- Apple iOS Safari & Android PWA Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ChatBoot" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/pwa-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa-180x180.png" />
    <link rel="apple-touch-startup-image" href="/apple-splash.png" />
    
    <meta name="format-detection" content="telephone=no" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <title>SaaS WhatsApp Master</title>
    <script>
      // Anti-flicker e sincronização da barra de status no Android / PWA
      const applyThemeColor = (isDark) => {
         const color = isDark ? '#202c33' : '#f0f2f5';
         const metaThemes = document.querySelectorAll('meta[name="theme-color"]');
         if (metaThemes.length > 0) {
            metaThemes.forEach(el => el.setAttribute('content', color));
         } else {
            const metaTheme = document.createElement('meta');
            metaTheme.name = 'theme-color';
            metaTheme.content = color;
            document.head.appendChild(metaTheme);
         }
         const metaScheme = document.querySelector('meta[name="color-scheme"]');
         if (metaScheme) {
            metaScheme.setAttribute('content', isDark ? 'dark' : 'light');
         }
         const metaApple = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
         if (metaApple) {
            metaApple.setAttribute('content', isDark ? 'black-translucent' : 'default');
         }
      };

      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
        applyThemeColor(true);
      } else {
        document.documentElement.classList.remove('dark');
        applyThemeColor(false);
      }

      // Separação estrita entre os 2 PWAs:
      // 1) Rota Exclusiva do Tablet da Cozinha (/totem-cozinha ou /totem) -> /manifest-totem.webmanifest
      // 2) Rota Principal do Celular / Chat (/, /login, /chat, etc.) -> /manifest.webmanifest
      try {
        const currentPath = window.location.pathname.toLowerCase();
        const isTotemRoute =
          currentPath.startsWith('/totem-cozinha') ||
          currentPath.startsWith('/totem');

        const syncManifestLink = (manifestHref) => {
          const allLinks = document.querySelectorAll('link[rel="manifest"]');
          if (allLinks.length > 0) {
            allLinks.forEach((el, idx) => {
              if (idx === 0) el.setAttribute('href', manifestHref);
              else el.remove();
            });
          } else {
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = manifestHref;
            document.head.appendChild(link);
          }
        };

        if (isTotemRoute) {
          document.title = 'Totem Cozinha • Checklists & Alarmes';
          const appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (appleTitle) appleTitle.setAttribute('content', 'Totem Cozinha');
          syncManifestLink('/manifest-totem.webmanifest');
          window.addEventListener('DOMContentLoaded', () => syncManifestLink('/manifest-totem.webmanifest'));
        } else {
          // Garante que a instalação na rota principal (celular) NUNCA abra a tela do tablet da cozinha
          localStorage.removeItem('totem_standalone_mode');
          const appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (appleTitle) appleTitle.setAttribute('content', 'ChatBoot');
          syncManifestLink('/manifest.webmanifest');
          window.addEventListener('DOMContentLoaded', () => syncManifestLink('/manifest.webmanifest'));
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
