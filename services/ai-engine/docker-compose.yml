name: ai-engine

services:
  ai-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-engine
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REDIS_URL=redis://appwrite-redis:6379
    networks:
      - coolify

networks:
  coolify:
    external: true
