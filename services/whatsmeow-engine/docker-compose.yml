name: whatsmeow-engine

services:
  whatsmeow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsmeow-engine
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - DB_PATH=/data/sessions.db
      - WEBHOOK_URL=http://business-engine:8083/webhooks/whatsapp
      - TZ=America/Sao_Paulo
    volumes:
      - /data/whatsmeow:/data
    networks:
      - coolify

networks:
  coolify:
    external: true
